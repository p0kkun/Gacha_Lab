version: 0.2

env:
  variables:
    LAMBDA_FUNCTION_NAME: poker-gacha-api
    APP_DIR: app

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd $APP_DIR
      - npm ci
  build:
    commands:
      - npm run lambda:routes
      - npm run db:generate
      - npx esbuild lambda/handler.ts --bundle --platform=node --target=node20 --outfile=lambda-dist/handler.js --format=cjs
      - npx esbuild $(find app/api -name route.ts -print) --platform=node --target=node20 --format=cjs --outbase=. --outdir=lambda-dist
      - if [ ! -f lambda-dist/app/api/admin/prize-tiers/route.js ]; then echo "Missing compiled route.js"; exit 1; fi
      - mkdir -p lambda-dist/node_modules
      - cp -r node_modules/@prisma lambda-dist/node_modules/
      - cp -r node_modules/next lambda-dist/node_modules/
      - cp -r node_modules/@next lambda-dist/node_modules/
      - cp -r node_modules/react lambda-dist/node_modules/
      - cp -r node_modules/react-dom lambda-dist/node_modules/
      - if [ -d node_modules/.prisma ]; then cp -r node_modules/.prisma lambda-dist/node_modules/; fi
      - cd lambda-dist
      - zip -r ../lambda.zip .
      - cd ..
      - aws lambda update-function-code --function-name $LAMBDA_FUNCTION_NAME --zip-file fileb://lambda.zip
