version: 0.2

env:
  variables:
    LAMBDA_FUNCTION_NAME: poker-gacha-api
    APP_DIR: app
    LAMBDA_ARTIFACT_BUCKET: poker-gacha-lambda-artifacts
    LAMBDA_ARTIFACT_KEY: lambda/poker-gacha-api.zip
    LAMBDA_LAYER_KEY: layer/poker-gacha-deps.zip
    LAMBDA_LAYER_NAME: poker-gacha-deps

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd $CODEBUILD_SRC_DIR/app
      - npm ci
  build:
    commands:
      - cd $CODEBUILD_SRC_DIR/app
      - pwd
      - ls -la
      - ls -la lambda || true
      - test -f lambda/handler.ts
      - npm run lambda:routes
      - npm run db:generate
      - npx esbuild ./lambda/handler.ts --bundle --platform=node --target=node20 --outfile=lambda-dist/handler.js --format=cjs
      - npx esbuild $(find app/api -name route.ts -print) --bundle --platform=node --target=node20 --format=cjs --outbase=app --outdir=lambda-dist --alias:@=./ --tsconfig=tsconfig.json
      - if [ ! -f lambda-dist/api/admin/prize-tiers/route.js ]; then echo "Missing compiled route.js"; exit 1; fi
      - mkdir -p lambda-dist/node_modules
      - mkdir -p lambda-dist/node_modules/next
      - |
        cat > lambda-dist/node_modules/next/server.js <<'EOF'
        class NextRequest extends Request {
          constructor(input, init) {
            super(input, init);
            this.nextUrl = new URL(this.url);
          }
        }
        class NextResponse extends Response {
          static json(body, init = {}) {
            const headers = new Headers(init.headers || {});
            if (!headers.has('content-type')) headers.set('content-type', 'application/json');
            return new NextResponse(JSON.stringify(body), { ...init, headers });
          }
        }
        module.exports = { NextRequest, NextResponse };
        EOF
      - |
        cat > lambda-dist/node_modules/next/package.json <<'EOF'
        { "name": "next", "version": "0.0.0-lambda-shim", "main": "./server.js" }
        EOF
      # Prisma deps are provided via Lambda Layer
      - mkdir -p layer/nodejs/node_modules
      - cp -r node_modules/@prisma layer/nodejs/node_modules/
      - if [ -d node_modules/.prisma ]; then cp -r node_modules/.prisma layer/nodejs/node_modules/; fi
      - cd lambda-dist
      - zip -r ../lambda.zip .
      - cd ..
      - cd layer
      - zip -r ../layer.zip .
      - cd ..
      - aws s3 cp lambda.zip s3://$LAMBDA_ARTIFACT_BUCKET/$LAMBDA_ARTIFACT_KEY
      - aws s3 cp layer.zip s3://$LAMBDA_ARTIFACT_BUCKET/$LAMBDA_LAYER_KEY
      - LAYER_VERSION_ARN=$(aws lambda publish-layer-version --layer-name $LAMBDA_LAYER_NAME --content S3Bucket=$LAMBDA_ARTIFACT_BUCKET,S3Key=$LAMBDA_LAYER_KEY --compatible-runtimes nodejs20.x --query 'LayerVersionArn' --output text)
      - aws lambda update-function-configuration --function-name $LAMBDA_FUNCTION_NAME --layers $LAYER_VERSION_ARN
      - aws lambda update-function-code --function-name $LAMBDA_FUNCTION_NAME --s3-bucket $LAMBDA_ARTIFACT_BUCKET --s3-key $LAMBDA_ARTIFACT_KEY
